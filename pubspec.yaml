name: font_subset
description: Builds or fetches the Flutter font-subset binary for Linux, macOS, and Windows and provides a Dart API for subsetting TTF/OTF fonts.
version: 0.2.1
repository: https://github.com/mosuem/font_subset

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  data_assets: ^0.20.0
  hooks: ^2.2.0
  mime: ^2.0.0

dev_dependencies:
  args: ^2.7.0
  dart_flutter_team_lints: ^3.5.2
  lints: ^6.0.0
  test: ^1.28.0

hooks:
  user_defines:
    font_subset:
      buildMode: checkout

topics:
  - fonts
  - flutter
  - hooks
